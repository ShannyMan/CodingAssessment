name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults
    
    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: .NET Tests
        path: TestResults/*.trx
        reporter: dotnet-trx
        fail-on-error: true
    
    - name: Post Test Status Comment
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request' && (success() || failure())
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Find the TRX file
          const testResultsDir = 'TestResults';
          const trxFiles = fs.readdirSync(testResultsDir).filter(file => file.endsWith('.trx'));
          
          if (trxFiles.length === 0) {
            console.log('No TRX files found');
            return;
          }
          
          const trxFile = path.join(testResultsDir, trxFiles[0]);
          const trxContent = fs.readFileSync(trxFile, 'utf8');
          
          // Parse basic test statistics from TRX
          const totalMatch = trxContent.match(/total="(\d+)"/);
          const passedMatch = trxContent.match(/passed="(\d+)"/);
          const failedMatch = trxContent.match(/failed="(\d+)"/);
          const skippedMatch = trxContent.match(/skipped="(\d+)"/);
          
          const total = totalMatch ? parseInt(totalMatch[1]) : 0;
          const passed = passedMatch ? parseInt(passedMatch[1]) : 0;
          const failed = failedMatch ? parseInt(failedMatch[1]) : 0;
          const skipped = skippedMatch ? parseInt(skippedMatch[1]) : 0;
          
          // Determine overall status
          const status = failed > 0 ? '❌ FAILED' : '✅ PASSED';
          const emoji = failed > 0 ? '❌' : '✅';
          
          // Create comment body
          const commentBody = `## ${emoji} Unit Test Results
          
          **Status:** ${status}
          
          **Summary:**
          - **Total Tests:** ${total}
          - **Passed:** ${passed} ✅
          - **Failed:** ${failed} ${failed > 0 ? '❌' : ''}
          - **Skipped:** ${skipped} ${skipped > 0 ? '⏭️' : ''}
          
          ${failed > 0 ? '⚠️ Some tests failed. Please review the test results above.' : '🎉 All tests passed successfully!'}
          
          ---
          *Workflow run: [${context.runNumber}](${context.payload.repository.html_url}/actions/runs/${context.runId})*`;
          
          // Post comment
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: commentBody
          });